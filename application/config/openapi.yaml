openapi: 3.0.3
info:
  title: Blog API
  version: "1.0.0"
  description: |
    マルチテナント・ブログの公開 API。第4問の対象。
    一覧 API はキーセット（カーソル）ページネーションを採用しており、
    OFFSET/LIMIT 方式の行ズレ問題（ページング中の重複/欠落）を回避する。
servers:
  - url: http://localhost:3000
    description: ローカル開発
paths:
  /api/v1/posts:
    get:
      summary: 投稿一覧（キーセットページネーション）
      description: |
        `created_at DESC, id DESC` 順で投稿一覧を返す。次ページは
        レスポンスの `meta.next_cursor` をそのまま `cursor` クエリに渡す。
        `cursor` はクライアントから見て不透明な文字列として扱うこと
        （内部表現はバージョン間で変わる可能性がある）。
      operationId: listPosts
      tags: [Posts]
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: 次ページ取得用カーソル。初回は省略。
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 1 ページあたり件数（1〜100、既定 20）。
      responses:
        "200":
          description: 一覧取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "400":
          description: 不正パラメータ（カーソル形式不正・per_page 範囲外など）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Post:
      type: object
      required: [id, title, content, published, views_count, author, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: "初投稿"
        content:
          type: string
          example: "本文..."
        published:
          type: boolean
          example: true
        views_count:
          type: integer
          example: 42
        author:
          nullable: true
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
          example: "2026-06-12T10:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-06-12T10:00:00.000000Z"
    Author:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Meta:
      type: object
      required: [per_page, has_next, next_cursor]
      properties:
        per_page:
          type: integer
          example: 20
        has_next:
          type: boolean
          example: true
        next_cursor:
          type: string
          nullable: true
          description: 次ページが無い場合は null
          example: "eyJjIjoiMjAyNi0wNi0xMlQxMDowMDowMC4wMDAwMDBaIiwiaSI6MTIzfQ"
    PostListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_cursor, invalid_per_page, not_found]
              example: invalid_cursor
            message:
              type: string
              example: "cursor is malformed"
