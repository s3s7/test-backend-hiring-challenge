# MySQL。バージョン5.6.4以上がサポートされます。
#
# MySQLドライバーをインストール
#   gem install mysql2
#
# GemfileにMySQL gemが定義されていることを確認
#   gem "mysql2"
#
# 新しいスタイルのパスワードハッシュを使用することを確認:
#   https://dev.mysql.com/doc/refman/5.7/en/password-hashing.html
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USER") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "backend_app_development" } %>

# Warning: The database defined as "test" will be erased and
# "rake"を実行すると、開発データベースから再生成されます。
# このdbを開発または本番と同じに設定しないでください。
test:
  <<: *default
  database: backend_app_test

# config/credentials.ymlと同様に、データベースパスワードのような機密情報を
# ソースコードに保存したくありません。ソースコードが誰かに見られた場合、
# データベースへのアクセスが可能になります。
#
# 代わりに、パスワードまたは完全な接続URLを環境変数として提供してください
# 変数として提供してください。例:
#
#   DATABASE_URL="mysql2://myuser:mypass@localhost/somedatabase"
#
# 特別なDATABASE_URL環境変数で接続URLが提供された場合、
# Railsはこのファイルで提供された値の上に自動的に設定値をマージします。
# または、接続URL環境変数を明示的に指定できます:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# 非プライマリデータベースの接続URLも環境変数を使用して設定できます。
# 変数名は接続名と `_DATABASE_URL` を連結して形成されます。例:
#
#   CACHE_DATABASE_URL="mysql2://cacheuser:cachepass@localhost/cachedatabase"
#
# データベース接続設定の完全な概要については
# https://guides.rubyonrails.org/configuring.html#configuring-a-database を参照してください。
#
production:
  primary: &primary_production
    <<: *default
    database: backend_app_production
    username: backend_app
    password: <%= ENV["BACKEND_APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: backend_app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: backend_app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: backend_app_production_cable
    migrations_paths: db/cable_migrate
