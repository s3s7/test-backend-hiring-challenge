inherit_gem:
  rubocop-rails-omakase: rubocop.yml

require:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "bin/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

RSpec/MultipleExpectations:
  Max: 5
RSpec/ExampleLength:
  Max: 15
RSpec/ContextWording:
  Enabled: false
RSpec/LetSetup:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
